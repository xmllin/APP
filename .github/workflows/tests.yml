name: Tests

on:
  push:
    branches:
      - main
      - audit-fixes-2026-09-21
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Build and run tests
        run: dotnet run --project Tests/WpfApp1.Tests.csproj --configuration Release
